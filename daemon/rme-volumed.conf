# RME ADI-2 Volume Daemon Configuration
# Install to /etc/rme-volumed.conf

[device]
# MIDI port - find with: amidi -l
midi_port = hw:0,0,0

# Device ID: 0x71=DAC, 0x72=Pro/Pro AE, 0x73=Pro SE
device_id = 0x72

# Output: line or phones
output = line

[volume]
# Volume range mapping
# MPD 0% = min_db, MPD 100% = max_db
min_db = -60.0
max_db = 0.0

# Default volume on startup (optional)
# default_db = -30.0

[mpd]
# MPD connection settings
host = localhost
port = 6600
